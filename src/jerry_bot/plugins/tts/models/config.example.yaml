#* Configuration for TTS plugin

enabled: false # set to true to enable the TTS plugin

max_concurrent_requests: 5 # maximum number of concurrent TTS requests allowed (defaults to 5)
user_timeout: 300.0 # seconds after the last request before the listener and voice client are cleaned up

#* TTS Service
# This plugin requires https://github.com/squid1127/jerry-bot-tts to function properly.
# It generates TTS via Kokoro, using a unix socket to communicate with this plugin, and a directory to store the actual audio
# This section will run the service as a child process while the plugin is loaded
service:
  use: false # set to true to run the tts service via the below command automatically
  command: "jerry-bot-tts"
  args:
    - "--socket-path" # should match the socket_path below
    - "tts.sock"
    - "--write-path" # should match the output_dir below
    - "audio"
  # cwd: # specify a CWD, relative to the bot's cwd
  # if cwd is unset, the plugin's directory will be used

#* Paths 
# These are relative to the plugin's directory unless relative_to_plugin is set to false
path:
  audio: "audio" # Path where the service outputs its audio files
  soundboard: "soundboard" # Path to soundboard files (see below)
  socket: "tts.sock" # Path to the service's socket
  relative_to_plugin: true
  clean_audio_dir: true # Whether to clean the audio directory on startup and periodically. If True, all files in the output_dir will erased regularly.

#* Voices
# List of allowed voices for the TTS service.
voices:
- name: Jerry (American English, Male, High Pitch) # Name shown in the UI
  voice: am_liam # Voice to use (found in https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md)
  speed: 1.0 # Speech rate
  sample_rate: 44100 # Sample rate; affects the playback speed; default is 2400
  default: true # Use as default
  lang_code: a # Language code (determines what language the generation will be in) (found in https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md)

- name: Liam (American English, Male)
