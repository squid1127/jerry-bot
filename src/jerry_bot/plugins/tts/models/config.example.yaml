#* Text Processing Configuration
text:
  debug: false # Set to true to see text processing

  control_rules:
    - pattern: >-
        ❌
      signal: skip # Cancels current playback
  
  soundboard_rules:
    - pattern: >-
        <:say_laufey:1518803827791237220>
      path: laufey.mp3

  # Normalization system - replaces matched patterns with replacement text
  normalize_rules:
    # Missing apostrophes
    - pattern: >-
        \bi['"]*m\b
      replacement: "I am"
    - pattern: >-
        \bi['"]*ve\b
      replacement: "I've"
    - pattern: >-
        \bi['"]*ll\b
      replacement: "I'll"
    - pattern: >-
        \bi['"]*d\b
      replacement: "I'd"
    - pattern: >-
        \bi*m+a\b
      replacement: "I'm gonna"

    # Common abbreviations
    - pattern: >-
        \blol\b
      replacement: "LOL"
    - pattern: >-
        \blmao\b
      replacement: "LMAO"
    - pattern: >-
        \bfuck?\Wyo?u\b
      replacement: "I love you! Heart emoji. Heart emoji."
    - pattern: >-
        \br\s?u\b
      replacement: "are you"
    - pattern: >-
        \bruok\b
      replacement: "are you okay"
    - pattern: >-
        \bthx\b
      replacement: "thanks"
    - pattern: >-
        \bty\b
      replacement: "thank you"
    - pattern: >-
        \bpl[sz]\b
      replacement: "please"
    - pattern: >-
        \bbrb\b
      replacement: "BRB"
    - pattern: >-
        \bgtg\b
      replacement: "gots to go"

    # Discord Objects
    - pattern: >-
        <@!?(\d+)>
      replacement: "at mention"
    - pattern: >-
        <@&(\d+)>
      replacement: "at role"
    - pattern: >-
        <#(\d+)>
      replacement: "hashtag channel"
